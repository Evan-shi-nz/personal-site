name: Sync posts from X

# Runs twice a day. Each new post becomes a Markdown file in src/content/notes,
# the commit triggers a Cloudflare Pages build, and the post appears on /notes.
# Does nothing until you add the X_BEARER_TOKEN secret and X_USERNAME variable
# under Settings → Secrets and variables → Actions.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-x.mjs
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: ${{ vars.X_USERNAME }}
      - name: Commit new notes
        run: |
          if [ -n "$(git status --porcelain src/content/notes)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/notes
            git commit -m "Sync posts from X"
            git push
          fi
